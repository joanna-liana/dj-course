<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA S2 Deliveroo - Obwodnica Warszafki</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7e22ce 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: auto;
            padding: 20px;
        }

        #game-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            margin: 0 auto;
        }

        canvas {
            background-color: #555;
            box-shadow:
                0 10px 40px rgba(0,0,0,0.5),
                0 0 20px rgba(255,255,255,0.1),
                inset 0 0 20px rgba(0,0,0,0.2);
            border-radius: 8px;
            border: 2px solid rgba(255,255,255,0.1);
        }

        #ui-container {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 280px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .panel {
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 15px;
            border-radius: 8px;
            pointer-events: auto;
            border: 1px solid #444;
        }

        h3 { margin: 0 0 10px 0; font-size: 16px; color: #3498db; }

        #levels-container {
            max-height: 150px;
            overflow-y: auto;
        }

        kbd {
            background-color: #eee;
            border-radius: 3px;
            border: 1px solid #b4b4b4;
            box-shadow: 0 1px 1px rgba(0,0,0,.2), 0 2px 0 0 rgba(255,255,255,.7) inset;
            color: #333;
            display: inline-block;
            font-size: .85em;
            font-weight: 700;
            line-height: 1;
            padding: 2px 4px;
            white-space: nowrap;
            margin: 2px;
        }

        .level-btn {
            display: block;
            width: 100%;
            padding: 8px;
            margin-bottom: 5px;
            background: #34495e;
            border: none;
            color: white;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s;
            text-align: left;
        }

        .level-btn:hover { background: #2980b9; }
        .level-btn.active { background: #27ae60; font-weight: bold; }

        #levels-container {
            max-height: 180px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            font-family: monospace;
            font-size: 14px;
            color: #ccc;
        }
        .stat-val { color: #fff; font-weight: bold; }

        .restart-btn:hover {
            background: #2ecc71;
        }

        .mode-btn {
            display: block;
            width: 100%;
            padding: 8px;
            margin-top: 10px;
            background: #34495e;
            border: none;
            color: white;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s;
            text-align: center;
        }
        .mode-btn:hover { background: #2980b9; }

        .collapsible-header {
            cursor: pointer;
            user-select: none;
            margin: 0;
            padding: 10px;
            background: #34495e;
            border-radius: 4px;
            transition: background 0.2s;
        }
        .collapsible-header:hover {
            background: #2c3e50;
        }
        .toggle-icon {
            display: inline-block;
            transition: transform 0.3s ease;
            font-size: 0.8em;
        }
        .toggle-icon.collapsed {
            transform: rotate(-90deg);
        }
        .collapsible-content {
            max-height: 1000px;
            overflow: hidden;
            transition: max-height 0.3s ease, opacity 0.3s ease;
            opacity: 1;
        }
        .collapsible-content.collapsed {
            max-height: 0;
            opacity: 0;
        }
    </style>
</head>
<body>

<script>
// --- COLLAPSIBLE SECTIONS ---
function toggleSection(sectionId) {
    const content = document.getElementById(sectionId + '-content');
    const icon = document.getElementById(sectionId + '-icon');

    if (content.classList.contains('collapsed')) {
        content.classList.remove('collapsed');
        icon.classList.remove('collapsed');
    } else {
        content.classList.add('collapsed');
        icon.classList.add('collapsed');
    }
}

// --- CONFIGURATION ---
const CONFIG = {
    // Car dimensions (approx 1px = 2cm scale)
    carWidth: 44,
    carLength: 90,
    wheelBase: 60,
    wheelWidth: 10,
    wheelLength: 20,

    // Physics - adjusted for "High Speed" potential
    // We map internal speed 1.0 to approx 15 km/h
    kmhFactor: 8,
    maxSpeed: 18.0, // ~216 km/h theoretical max
    maxReverseSpeed: -5.0, // ~60 km/h

    // Car mode: 'normal' (city car) or 'sport' (performance car)
    carMode: 'normal', // Default: normal city car
    accelerationNormal: 0.05, // ~10 seconds to 100 km/h (city car)
    accelerationSport: 0.15,   // ~1.4 seconds to 100 km/h (sport car)
    get acceleration() {
        return this.carMode === 'sport' ? this.accelerationSport : this.accelerationNormal;
    },

    friction: 0.06,
    brakingForce: 0.5,

    // Steering
    maxSteerAngle: 0.65, // ~37 degrees
    steerSpeed: 0.03, // Slower steering change for weight feeling
    steerRestoringDriving: 0.02, // Auto-center speed for Driving Mode

    // Handbrake Start (Launch Control)
    handbrakeBoostRate: 0.018, // Jak szybko buduje się boost (obroty silnika)
    handbrakeBoostMax: 1.0, // Maksymalny poziom boost
    handbrakeBoostMultiplier: 6.0, // Mnożnik przyspieszenia przy starcie - MEGA BOOST!
    handbrakeBoostDecay: 0.05, // Jak szybko spada boost gdy nie używany

    // Drift Physics (New!)
    tireGrip: 0.85, // Przyczepność opon (0.0 = brak, 1.0 = perfekcyjna) - ZMNIEJSZONE dla łatwiejszego poślizgu
    tireGripBraking: 0.65, // Zmniejszona przyczepność podczas hamowania - BARDZIEJ zmniejszone
    driftThreshold: 2.0, // Minimalna prędkość dla poślizgu - OBNIŻONE
    driftFriction: 0.98, // Tarcie podczas poślizgu (wyższe = wolniejsze hamowanie)
    angularDamping: 0.94, // Tłumienie rotacji podczas poślizgu - więcej rotacji
    lateralForceMultiplier: 2.0, // Mnożnik siły bocznej (symuluje v² zamiast v) - ZWIĘKSZONE!

    // Interaction
    curbSafeSpeed: 1.5 // ~18 km/h. Below this, curbs bounce. Above, crash.
};

// --- VEHICLE TYPES ---

    },
    scooter: {

        width: 18,
        length: 45,
        wheelBase: 30,
        maxSpeed: 12.0,
        acceleration: 0.08,
        maxSteerAngle: 0.90,
        brakingForce: 0.50,
        tireGrip: 0.70,
        turboMultiplier: 1.6,
        description: "Slowest but tiny"
    }
};

// --- UTILS ---
function saveVehicleSelection(vehicleType) {
    localStorage.setItem('selectedVehicle', vehicleType);
}

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playBonkSound() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(150, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.5);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.6);
}

function playCurbSound() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(80, audioCtx.currentTime);
    osc.frequency.linearRampToValueAtTime(60, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.2);
}

// Dźwięk piszczących opon podczas poślizgu
let driftOscillator = null;
let driftGain = null;

function startDriftSound(intensity = 1.0) {
    if (audioCtx.state === 'suspended') audioCtx.resume();

    // Jeśli już gra, nie twórz nowego
    if (driftOscillator) return;

    driftOscillator = audioCtx.createOscillator();
    driftGain = audioCtx.createGain();

    driftOscillator.type = 'sawtooth';
    driftOscillator.frequency.setValueAtTime(180 + intensity * 100, audioCtx.currentTime);

    driftGain.gain.setValueAtTime(0, audioCtx.currentTime);
    driftGain.gain.linearRampToValueAtTime(0.15 * intensity, audioCtx.currentTime + 0.05);

    driftOscillator.connect(driftGain);
    driftGain.connect(audioCtx.destination);
    driftOscillator.start();
}

function updateDriftSound(intensity = 1.0) {
    if (!driftOscillator || !driftGain) return;

    const now = audioCtx.currentTime;
    driftOscillator.frequency.setValueAtTime(180 + intensity * 100, now);
    driftGain.gain.setValueAtTime(0.15 * intensity, now);
}

function stopDriftSound() {
    if (!driftOscillator || !driftGain) return;

    const now = audioCtx.currentTime;
    driftGain.gain.linearRampToValueAtTime(0.01, now + 0.1);

    setTimeout(() => {
        if (driftOscillator) {
            driftOscillator.stop();
            driftOscillator = null;
            driftGain = null;
        }
    }, 150);
}

// Dźwięk silnika na wysokich obrotach (revving)
let engineRevOscillator = null;
let engineRevGain = null;

function startEngineRevSound(revLevel = 0.5) {
    if (audioCtx.state === 'suspended') audioCtx.resume();

    // Jeśli już gra, nie twórz nowego
    if (engineRevOscillator) return;

    engineRevOscillator = audioCtx.createOscillator();
    engineRevGain = audioCtx.createGain();

    engineRevOscillator.type = 'sawtooth';
    engineRevOscillator.frequency.setValueAtTime(80 + revLevel * 120, audioCtx.currentTime);

    engineRevGain.gain.setValueAtTime(0, audioCtx.currentTime);
    engineRevGain.gain.linearRampToValueAtTime(0.12 * revLevel, audioCtx.currentTime + 0.05);

    engineRevOscillator.connect(engineRevGain);
    engineRevGain.connect(audioCtx.destination);
    engineRevOscillator.start();
}

function updateEngineRevSound(revLevel = 0.5) {
    if (!engineRevOscillator || !engineRevGain) return;

    const now = audioCtx.currentTime;
    engineRevOscillator.frequency.setValueAtTime(80 + revLevel * 120, now);
    engineRevGain.gain.setValueAtTime(0.12 * revLevel, now);
}

function stopEngineRevSound() {
    if (!engineRevOscillator || !engineRevGain) return;

    const now = audioCtx.currentTime;
    engineRevGain.gain.linearRampToValueAtTime(0.01, now + 0.15);

    setTimeout(() => {
        if (engineRevOscillator) {
            engineRevOscillator.stop();
            engineRevOscillator = null;
            engineRevGain = null;
        }
    }, 200);
}

// Dźwięk turbo (layered engine vroom)
let turboOscillator1 = null;
let turboOscillator2 = null;
let turboGain = null;

function startTurboSound() {
    if (audioCtx.state === 'suspended') audioCtx.resume();

    if (turboOscillator1) return;

    // Low rumble
    turboOscillator1 = audioCtx.createOscillator();
    turboOscillator1.type = 'sawtooth';
    turboOscillator1.frequency.setValueAtTime(65, audioCtx.currentTime);

    // Mid-range growl
    turboOscillator2 = audioCtx.createOscillator();
    turboOscillator2.type = 'sawtooth';
    turboOscillator2.frequency.setValueAtTime(130, audioCtx.currentTime);

    turboGain = audioCtx.createGain();
    turboGain.gain.setValueAtTime(0, audioCtx.currentTime);
    turboGain.gain.linearRampToValueAtTime(0.18, audioCtx.currentTime + 0.15);

    turboOscillator1.connect(turboGain);
    turboOscillator2.connect(turboGain);
    turboGain.connect(audioCtx.destination);

    turboOscillator1.start();
    turboOscillator2.start();
}

function updateTurboSound(speed) {
    if (!turboOscillator1 || !turboOscillator2 || !turboGain) return;

    const now = audioCtx.currentTime;
    const baseFreq1 = 65 + Math.abs(speed) * 3;
    const baseFreq2 = 130 + Math.abs(speed) * 6;

    turboOscillator1.frequency.setValueAtTime(baseFreq1, now);
    turboOscillator2.frequency.setValueAtTime(baseFreq2, now);
}

function stopTurboSound() {
    if (!turboOscillator1 || !turboOscillator2 || !turboGain) return;

    const now = audioCtx.currentTime;
    const osc1 = turboOscillator1;
    const osc2 = turboOscillator2;
    const gain = turboGain;

    // Clear immediately so new sound can start
    turboOscillator1 = null;
    turboOscillator2 = null;
    turboGain = null;

    // Fade out and stop
    gain.gain.linearRampToValueAtTime(0.01, now + 0.3);

    setTimeout(() => {
        osc1.stop();
        osc2.stop();
    }, 350);
}


function playLevelCompleteSound() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.connect(audioCtx.destination);

    const notes = [261.63, 329.63, 392.00, 523.25]; // C4, E4, G4, C5
    notes.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.1);
        osc.connect(gain);
        osc.start(audioCtx.currentTime + i * 0.1);
        osc.stop(audioCtx.currentTime + i * 0.1 + 0.1);
    });
}

// Geometric Utils
function getCorners(x, y, w, h, angle) {
    const cos = Math.cos(angle);
    const sin = Math.sin(angle);
    const hw = w / 2;
    const hh = h / 2;
    return [
        { x: x + (hh * cos - hw * sin), y: y + (hh * sin + hw * cos) },
        { x: x + (hh * cos + hw * sin), y: y + (hh * sin - hw * cos) },
        { x: x + (-hh * cos + hw * sin), y: y + (-hh * sin - hw * cos) },
        { x: x + (-hh * cos - hw * sin), y: y + (-hh * sin + hw * cos) }
    ];
}

function projectPolygon(axis, corners) {
    let min = Infinity;
    let max = -Infinity;
    for (let p of corners) {
        const proj = (p.x * axis.x + p.y * axis.y);
        if (proj < min) min = proj;
        if (proj > max) max = proj;
    }
    return { min, max };
}

function overlap(a, b) {
    return !(a.min > b.max || b.min > a.max);
}

function checkRectCollision(rectA, rectB) {
    const cornersA = getCorners(rectA.x, rectA.y, rectA.w, rectA.l, rectA.angle);
    const cornersB = getCorners(rectB.x, rectB.y, rectB.w, rectB.l, rectB.angle);
    const axes = [
        { x: Math.cos(rectA.angle), y: Math.sin(rectA.angle) },
        { x: -Math.sin(rectA.angle), y: Math.cos(rectA.angle) },
        { x: Math.cos(rectB.angle), y: Math.sin(rectB.angle) },
        { x: -Math.sin(rectB.angle), y: Math.cos(rectB.angle) }
    ];
    for (let axis of axes) {
        const pA = projectPolygon(axis, cornersA);
        const pB = projectPolygon(axis, cornersB);
        if (!overlap(pA, pB)) return false;
    }
    return true;
}

function checkCircleRectCollision(circle, rect) {
    const cos = Math.cos(-rect.angle);
    const sin = Math.sin(-rect.angle);
    const dx = circle.x - rect.x;
    const dy = circle.y - rect.y;
    const localX = dx * cos - dy * sin;
    const localY = dx * sin + dy * cos;
    const closestX = Math.max(-rect.l/2, Math.min(localX, rect.l/2));
    const closestY = Math.max(-rect.w/2, Math.min(localY, rect.w/2));
    const distanceX = localX - closestX;
    const distanceY = localY - closestY;
    return (distanceX * distanceX) + (distanceY * distanceY) < (circle.r * circle.r);
}

function isPointInRotatedRect(point, rect) {
    const cos = Math.cos(-rect.angle);
    const sin = Math.sin(-rect.angle);
    const dx = point.x - rect.x;
    const dy = point.y - rect.y;
    const localX = dx * cos - dy * sin;
    const localY = dx * sin + dy * cos;
    return Math.abs(localX) < rect.l / 2 && Math.abs(localY) < rect.w / 2;
}

</script>

<script>
// --- INIT ---

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const input = new InputHandler();
let game;

function loadNextLevel() {
    const nextLevel = game.currentLevelIdx + 1;
    if (nextLevel < game.levels.length) {
        game.loadLevel(nextLevel);
    } else {
        alert('Gratulacje! Ukończyłeś wszystkie poziomy!');
        game.loadLevel(0);
    }
}

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    if (game && game.state !== 'TITLE_SCREEN' && game.state !== 'LEVEL_COMPLETE') {
        game.loadLevel(game.currentLevelIdx);
    }
}

let lastTime = 0;
function loop(timestamp = 0) {
    if (!game) return;

    // Calculate delta time in seconds
    const deltaTime = lastTime ? Math.min((timestamp - lastTime) / 1000, 0.1) : 0.016;
    lastTime = timestamp;

    game.update(deltaTime);
    game.draw();
    requestAnimationFrame(loop);
}

// Mouse handling for title screen and level complete screen
canvas.addEventListener('mousemove', (e) => {
    if (!game) return;
    
    const rect = canvas.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;
    
    // Title screen button
    if (game.state === 'TITLE_SCREEN' && game.titleButtonBounds) {
        const btn = game.titleButtonBounds;
        game.titleButtonHover = (
            mouseX >= btn.x && mouseX <= btn.x + btn.width &&
            mouseY >= btn.y && mouseY <= btn.y + btn.height
        );
        canvas.style.cursor = game.titleButtonHover ? 'pointer' : 'default';
    }
    // Vehicle selection buttons
    else if (game.state === 'VEHICLE_SELECTION') {
        let hover = false;
        if (game.leftArrowBounds) {
            const btn = game.leftArrowBounds;
            if (mouseX >= btn.x && mouseX <= btn.x + btn.width &&
                mouseY >= btn.y && mouseY <= btn.y + btn.height) {
                hover = true;
            }
        }
        if (game.rightArrowBounds) {
            const btn = game.rightArrowBounds;
            if (mouseX >= btn.x && mouseX <= btn.x + btn.width &&
                mouseY >= btn.y && mouseY <= btn.y + btn.height) {
                hover = true;
            }
        }
        if (game.confirmButtonBounds) {
            const btn = game.confirmButtonBounds;
            if (mouseX >= btn.x && mouseX <= btn.x + btn.width &&
                mouseY >= btn.y && mouseY <= btn.y + btn.height) {
                hover = true;
            }
        }
        canvas.style.cursor = hover ? 'pointer' : 'default';
    }
    // Level complete button
    else if (game.state === 'LEVEL_COMPLETE' && game.levelCompleteButtonBounds) {
        const btn = game.levelCompleteButtonBounds;
        game.levelCompleteButtonHover = (
            mouseX >= btn.x && mouseX <= btn.x + btn.width &&
            mouseY >= btn.y && mouseY <= btn.y + btn.height
        );
        canvas.style.cursor = game.levelCompleteButtonHover ? 'pointer' : 'default';
    }
    // Reset cursor when not on special screens
    else {
        canvas.style.cursor = 'default';
    }
});

canvas.addEventListener('click', (e) => {
    if (!game) return;
    
    const rect = canvas.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;
    
    // Title screen button
    if (game.state === 'TITLE_SCREEN' && game.titleButtonBounds) {
        const btn = game.titleButtonBounds;
        const isInButton = (
            mouseX >= btn.x && mouseX <= btn.x + btn.width &&
            mouseY >= btn.y && mouseY <= btn.y + btn.height
        );
        
        if (isInButton) {
            canvas.style.cursor = 'default';
            game.startGame();
        }
    }

    // Vehicle selection buttons
    if (game.state === 'VEHICLE_SELECTION') {
        // Left arrow
        if (game.leftArrowBounds) {
            const btn = game.leftArrowBounds;
            if (mouseX >= btn.x && mouseX <= btn.x + btn.width &&
                mouseY >= btn.y && mouseY <= btn.y + btn.height) {
                game.selectionIndex = (game.selectionIndex - 1 + game.selectionVehicles.length) % game.selectionVehicles.length;
            }
        }

        // Right arrow
        if (game.rightArrowBounds) {
            const btn = game.rightArrowBounds;
            if (mouseX >= btn.x && mouseX <= btn.x + btn.width &&
                mouseY >= btn.y && mouseY <= btn.y + btn.height) {
                game.selectionIndex = (game.selectionIndex + 1) % game.selectionVehicles.length;
            }
        }

        // Confirm button
        if (game.confirmButtonBounds) {
            const btn = game.confirmButtonBounds;
            if (mouseX >= btn.x && mouseX <= btn.x + btn.width &&
                mouseY >= btn.y && mouseY <= btn.y + btn.height) {
                const selectedType = game.selectionVehicles[game.selectionIndex];
                game.selectedVehicle = selectedType;
                saveVehicleSelection(selectedType);
                game.player.vehicleType = selectedType;
                game.player.reset(0, 0, 0);
                game.currentLevelIdx = 0;
                game.loadLevel(0);
            }
        }
    }

    // Level complete button
    if (game.state === 'LEVEL_COMPLETE' && game.levelCompleteButtonBounds) {
        const btn = game.levelCompleteButtonBounds;
        const isInButton = (
            mouseX >= btn.x && mouseX <= btn.x + btn.width &&
            mouseY >= btn.y && mouseY <= btn.y + btn.height
        );
        
        if (isInButton) {
            canvas.style.cursor = 'default';
            loadNextLevel();
        }
    }
});

window.onload = function() {
    game = new Game();
    window.addEventListener('resize', resize);
    resize(); // Initial resize and level load
    loop();
};
</script>
</body>
</html>
